[package]
name = "crocodile-gena-studio"
version = "5.5.6"
license = "GPL-3.0-only"
description = "CrocodileGena Studio desktop application"
authors = ["CrocodileGena Studio"]
edition = "2021"

[lib]
name = "crocodile_gena_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml_edit = "0.25"
tauri = { version = "2.11.1", features = [] }
walkdir = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip", "brotli"] }
zip = { version = "2", default-features = false, features = ["deflate", "aes-crypto"] }
unrar = "0.5.8"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
arboard = { version = "3", default-features = false }
winreg = "0.55"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls"] }

[target.'cfg(windows)'.dev-dependencies]
windows-core = "0.61.2"

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
