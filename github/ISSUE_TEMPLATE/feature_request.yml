name: Предложить функцию
description: Идея для улучшения Crocodile Gena Studio
title: "[Idea]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую проблему решает идея
      description: Опишите ситуацию пользователя, а не только название кнопки.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое решение
      description: Как функция должна выглядеть и работать?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Возможные альтернативы
      description: Есть ли более простой вариант решения?
  - type: dropdown
    id: module
    attributes:
      label: К какому модулю относится идея
      options:
        - Всё приложение
        - Online Fix
        - Менеджер сохранений
        - DLC Unlocker
        - CrocLua
        - Новый модуль
        - Другое
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Подтверждение
      options:
        - label: Я проверил открытые Issues и не нашёл такого же предложения.
          required: true
